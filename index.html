<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="My-part">
        <div class="sub-form">
            <h1>Registration Form</h1>
            <form>
            <div class="left-side" >
            <label for="name">Full Name:</label>
            <input type="text" id="name" placeholder="Enter your name">
            <br>
            <label for="email">Email:</label>
            <input type="email" id="email" placeholder="Enter your email">
            <br>
            <label for="password">Password:</label>
            <input type="password" id="password" placeholder="Enter your password">
            <br>
            <input type="submit" value="Register">
            <input type="reset" value="Reset">
            </div>   
           
            <div class="right-side">
            <label for="gender">Gender:</label>
            <input type="radio" id="gender" name="gender" >
            <label for="gender">Male</label>
            
            <input type="radio" id="gender" name="gender" >
            <label for="gender">Female</label>
            <br>
            <label for="dept">Department:</label>
            <select id="dept" >
                <option>Choose Department</option>
                <option>CS</option>
                <option>BBA</option>
                <option>SE</option>
                <option>ISLAMIYAT</option>
                <option>ENGLISH</option>
            </select>
            <br>
            <label for="course">Courses:</label>
            
            <input type="checkbox" id="course">
            <label for="course" class="course-set">Web Technologies</label>
            <br>
            
            <input type="checkbox" id="course" class="course-set">
            <label for="course" id="course-name"class="course-set">Database System</label>
            <br>
            <input type="checkbox" id="course">
            <label for="course"id="course-name class="course-set">Programming</label>
            <br>

            <label for="msg">Message:</label>
            <textarea rows="4" cols="25" id="msg" placeholder="Write your message here"></textarea>

            </div>
            

            </form>
            

    </div>
    <div class="graphics">
            <h1>Listen to Our Message</h1>
            <audio controls>
                <source src="audio.mp3" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>
            <img src="uni.jfif" alt="Image" class="image">
            <h1>Welcome to EduWorld!</h1>
            <h2>Join us and be a part of something great.</h2>
            </div>
       </div>
        

    <footer>

    </footer>
</body>
</html>
